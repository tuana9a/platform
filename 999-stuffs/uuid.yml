---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uuid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uuid
  template:
    metadata:
      labels:
        app: uuid
    spec:
      containers:
        - image: tuana9a/uuid:git-af287c15e3b164a81fcf36e6a679c12d190d4cbe
          name: uuid
          env:
            - name: BIND
              value: "0.0.0.0"
            - name: PORT
              value: "8080"
          resources:
            requests:
              memory: "10Mi"
              cpu: "5m"
            limits:
              memory: "10Mi"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              port: 8080
              path: "/"
          livenessProbe:
            tcpSocket:
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: uuid
spec:
  selector:
    app: uuid
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      name: http
---
kind: ListenerSet
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: uuid
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production-gatewayapi
spec:
  parentRef:
    name: starscream
    namespace: envoy-gateway-system
  listeners:
    - name: https
      hostname: uuid.tuana9a.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: uuid-tuana9a-com-tls
    - name: http
      hostname: uuid.tuana9a.com
      port: 80
      protocol: HTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: uuid
spec:
  parentRefs:
    - kind: ListenerSet
      name: uuid
  hostnames:
    - uuid.tuana9a.com
  rules:
    - backendRefs:
        - kind: Service
          name: uuid
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
