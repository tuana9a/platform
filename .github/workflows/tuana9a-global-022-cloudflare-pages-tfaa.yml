name: "tuana9a/global/022-cloudflare-pages"

on:
  workflow_dispatch:
  push:
    paths:
      - "tuana9a/global/022-cloudflare-pages/**"
      - ".github/workflows/tuana9a-global-022-cloudflare-pages-tfaa*"
    branches:
      - rock-n-roll

jobs:
  main:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/tfaa.yml
    with:
      runs-on: self-hosted-0
      WORKING_DIR: ${{ github.workflow }}
      login-vault-in-cluster-sa: true
    secrets: inherit
