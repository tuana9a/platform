apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  nginx.conf: |
    events {}

    http {
      server {
        listen 8080;

        location / {
          root /etc/app/config/;
          index index.html;
        }
      }
    }

  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>Kubernetes NGINX</title>
    </head>
    <body>
      <h1>Hello from ConfigMap mounted NGINX!</h1>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.29
          command:
            ["nginx", "-c", "/etc/app/config/nginx.conf", "-g", "daemon off;"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/app/config/
          resources:
            requests:
              cpu: 5m
              memory: 10Mi
            limits:
              cpu: 5m
              memory: 10Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 5

          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 5

      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-config
