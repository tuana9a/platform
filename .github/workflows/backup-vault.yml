name: backup-vault

on:
  schedule:
    - cron: "0 0 * * *" # daily at 00:00 UTC — adjust as needed
  workflow_dispatch: {} # allows manual trigger from the Actions tab

env:
  VAULT_ADDR: ${{ secrets.VAULT_ADDR || 'https://vault.tuana9a.com' }}
  VAULT_ROLE: ${{ vars.VAULT_ROLE || 'gha-sa' }}
  SA_TOKEN_PATH: /var/run/secrets/kubernetes.io/serviceaccount/token

jobs:
  backup:
    runs-on: self-hosted-0
    steps:
      - name: Install Vault CLI and jq
        run: |
          set -e
          VAULT_VERSION=1.17.6
          JQ_VERSION=1.7.1
          BIN_DIR="${RUNNER_TEMP}/bin"
          mkdir -p "$BIN_DIR"

          # /usr/bin is not executable on this runner, so install into
          # RUNNER_TEMP instead (guaranteed writable + exec) and prepend to PATH.
          curl -fsSL -o vault.zip \
            "https://releases.hashicorp.com/vault/${VAULT_VERSION}/vault_${VAULT_VERSION}_linux_amd64.zip"
          python3 -c "import zipfile; zipfile.ZipFile('vault.zip').extractall('${BIN_DIR}')"

          curl -fsSL -o "${BIN_DIR}/jq" \
            "https://github.com/jqlang/jq/releases/download/jq-${JQ_VERSION}/jq-linux-amd64"

          chmod +x "${BIN_DIR}/vault" "${BIN_DIR}/jq"
          echo "$BIN_DIR" >> "$GITHUB_PATH"

      - name: Login to Vault using k8s SA JWT
        run: |
          JWT=$(cat "${SA_TOKEN_PATH}")

          VAULT_TOKEN=$(curl -sSf \
            --request POST \
            --header "X-Vault-Request: true" \
            --data "{\"jwt\":\"${JWT}\",\"role\":\"${VAULT_ROLE}\"}" \
            "${VAULT_ADDR}/v1/auth/in-cluster/login" | jq -r '.auth.client_token')

          if [ -z "$VAULT_TOKEN" ] || [ "$VAULT_TOKEN" = "null" ]; then
            echo "Failed to obtain Vault token" >&2
            exit 1
          fi
          echo "::add-mask::$VAULT_TOKEN"
          curl -sSf \
            --header "X-Vault-Token: $VAULT_TOKEN" \
            "$VAULT_ADDR/v1/auth/token/lookup-self" | jq '.data.ttl'
          echo "VAULT_TOKEN=$VAULT_TOKEN" >> "$GITHUB_ENV"

      - name: Verify Vault connectivity
        run: vault status || true # non-zero exit on sealed vault; don't fail the job here

      - name: Take Raft snapshot
        id: snapshot
        run: |
          set -e
          TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)
          FILE="vault-backup-${TIMESTAMP}.snap"
          vault operator raft snapshot save "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Upload snapshot as artifact
        uses: actions/upload-artifact@v4
        with:
          name: vault-backup-${{ github.run_id }}
          path: ${{ steps.snapshot.outputs.file }}
          retention-days: 30

      # Optional: ship the snapshot offsite too, e.g. to S3/GCS/MinIO.
      # GitHub Actions artifacts are fine for short-term retention but
      # shouldn't be your only copy for a real backup strategy.
      # - name: Upload to S3
      #   run: aws s3 cp "${{ steps.snapshot.outputs.file }}" s3://my-vault-backups/

      - name: Notify Telegram - Success
        if: success()
        run: |
          curl -sf -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            -d text="✅ *Vault backup succeeded*
          File: \`${{ steps.snapshot.outputs.file }}\`
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Notify Telegram - Failure
        if: failure()
        run: |
          curl -sf -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            -d text="❌ *Vault backup FAILED*
          Repo: ${{ github.repository }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
