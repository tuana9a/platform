apiVersion: v1
kind: Pod
metadata:
  name: alpine
spec:
  containers:
    - name: alpine
      image: alpine
      command: ["/bin/sleep"]
      args: ["1d"]
      resources:
        requests:
          cpu: 5m
          memory: 5Mi
        limits:
          cpu: 5m
          memory: 5Mi
  restartPolicy: Never
---
