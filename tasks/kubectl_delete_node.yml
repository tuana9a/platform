- name: kubectl delete node
  become: true
  ansible.builtin.command: >
    kubectl delete node {{ k8s_node_name }}
  register: kubectl_delete_node_result
  environment:
    KUBECONFIG: "{{ kubeconfig | default('/etc/kubernetes/admin.conf') }}"
  changed_when: kubectl_delete_node_result.rc == 0

- name: kubectl delete node result
  debug:
    msg:
      stdout: "{{ kubectl_delete_node_result.stdout | split('\n') }}"
      stderr: "{{ kubectl_delete_node_result.stderr | split('\n') }}"

- name: kubectl delete node fail
  ansible.builtin.fail:
    msg: "{{ kubectl_delete_node_result.stderr | split('\n') }}"
  when: kubectl_delete_node_result.rc != 0
