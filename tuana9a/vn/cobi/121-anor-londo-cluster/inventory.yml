DO_NOT_USE: # NOTE: storing common variables
  hosts:
    localhost:
      kube_pki: &kube_pki
        - /etc/kubernetes/pki/ca.crt
        - /etc/kubernetes/pki/ca.key
        - /etc/kubernetes/pki/sa.key
        - /etc/kubernetes/pki/sa.pub
        - /etc/kubernetes/pki/front-proxy-ca.crt
        - /etc/kubernetes/pki/front-proxy-ca.key
        - /etc/kubernetes/pki/etcd/ca.crt
        - /etc/kubernetes/pki/etcd/ca.key
      kubevip: &kubevip
        inf: eth0
        vip: 192.168.56.21
      kubernetes_major_version: &kubernetes_major_version "1.33"
      kubernetes_minor_version: &kubernetes_minor_version "1.33.10"
      cluster_ops: &cluster_ops
        # some operation required taking variable from control plane like:
        # - getting kube_pki
        # - kube join command
        # each data node having this variable will be able to reference control plane via hostvars, example: "hostvars[cluster_ops.host].kube_join_command"
        host: 192.168.56.25
        remove_hosts:
          - 192.168.56.22
      gateway_ip: &gateway_ip 192.168.56.1
      cloudimg: &cloudimg debian-12-generic-amd64-20260510-2474.img

      k8s_node_defaults: &k8s_node_defaults
        ansible_user: u
        pve_cluster: "alien"
        pve_node: "neomorph"
        cloudimg: *cloudimg
        pve_network_device: "vmbr0"
        gateway_ip: *gateway_ip
        cluster_ops: *cluster_ops
        kubernetes_major_version: *kubernetes_major_version
        kubernetes_minor_version: *kubernetes_minor_version

      control_plane_defaults: &control_plane_defaults
        <<: *k8s_node_defaults
        roles:
          - control-plane
        corecount: 2
        memsize: 4096
        kube_pki: *kube_pki
        kubevip: *kubevip
      data_plane_defaults: &data_plane_defaults
        <<: *k8s_node_defaults
        roles:
          - data-plane
        corecount: 4
        memsize: 12288
k8s_cluster:
  hosts:
    # --- CONTROL PLANE ---
    192.168.56.25: &i-125
      <<: *control_plane_defaults
      vmid: 125
      pve_node: "engineer"
      nodename: i-125
      upgrade:
        batch: batch1
        skip_phases: ["kube-proxy"] # TODO: test this next time
      corecount: 2
      memsize: 6144
    192.168.56.26: &i-126
      <<: *control_plane_defaults
      vmid: 126
      pve_node: "engineer"
      nodename: i-126
      upgrade:
        batch: batch2
        skip_phases: ["kube-proxy"] # TODO: test this next time
      corecount: 2
      memsize: 6144
    192.168.56.27: &i-127
      <<: *control_plane_defaults
      vmid: 127
      nodename: i-127
      upgrade:
        batch: batch3
        skip_phases: ["kube-proxy"] # TODO: test this next time
      corecount: 2
      memsize: 6144

    # --- DATA PLANE ---
    192.168.56.37: &i-137
      <<: *data_plane_defaults
      nodename: i-137
      vmid: 137
      upgrade:
        batch: batch4
        skip_phases: ["kube-proxy"]
      wireguard_clients:
        - file: i-137.conf
          name: i-137
          state: stopped
          enabled: true
    192.168.56.38: &i-138
      <<: *data_plane_defaults
      nodename: i-138
      vmid: 138
      upgrade:
        batch: batch5
        skip_phases: ["kube-proxy"]
      wireguard_clients:
        - file: i-138.conf
          name: i-138
          state: stopped
          enabled: true
    192.168.56.40: &i-140
      <<: *data_plane_defaults
      nodename: i-140
      vmid: 140
      corecount: 4
      memsize: 8192
      upgrade:
        batch: batch5
        skip_phases: ["kube-proxy"]
      wireguard_clients:
        - file: i-140.conf
          name: i-140
          state: stopped
          enabled: true
