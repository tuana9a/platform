name: "tuana9a/vn/cobi/502-coder"

on:
  workflow_dispatch:
  push:
    paths:
      - "tuana9a/vn/cobi/502-coder/**"
      - "!tuana9a/vn/cobi/502-coder/503-coder-config/**"
      - ".github/workflows/tuana9a-vn-502-coder-tfaa*"
    branches:
      - rock-n-roll

jobs:
  main:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/tfaa.yml
    with:
      runs-on: self-hosted-0
      login-vault: "in-cluster-sa"
      WORKING_DIR: ${{ github.workflow }}
    secrets: inherit
