name: "tuana9a/global/021-r2"

on:
  workflow_dispatch:
  push:
    paths:
      - "tuana9a/global/021-r2/**"
      - ".github/workflows/tuana9a-global-021-r2-tfaa*"
    branches:
      - rock-n-roll

jobs:
  main:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/tfaa.yml
    with:
      runs-on: self-hosted-0
      install-sops: false
      WORKING_DIR: ${{ github.workflow }}
      AWS_ASSUME_ROLE: arn:aws:iam::384588864907:role/github-workflow
      download-secret-files: true
    secrets: inherit
