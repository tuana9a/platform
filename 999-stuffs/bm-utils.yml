apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: bm-utils
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-tuana9a-com
    kind: ClusterSecretStore
  target:
    name: bm-utils
  dataFrom:
    - extract:
        key: bm-utils
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bm-utils
data:
  PORT: "5000"
  BASE_URL: https://utils.bm.tuana9a.com
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bm-utils
spec:
  serviceName: bm-utils
  replicas: 1
  selector:
    matchLabels:
      app: bm-utils
  template:
    metadata:
      labels:
        app: bm-utils
    spec:
      securityContext:
        fsGroup: 101 # uid=100(appuser) gid=101(appgroup) groups=101(appgroup)
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: bm-utils
          image: tuana9a/bm-utils:git-91b4ef05d999f87f29fd129217907ea351e6fe2e
          envFrom:
            - configMapRef:
                name: bm-utils
            - secretRef:
                name: bm-utils
          resources:
            requests:
              memory: "100Mi"
              cpu: "100m"
            limits:
              memory: "100Mi"
          volumeMounts:
            - name: workdir
              mountPath: /app/workdir.tmp
  volumeClaimTemplates:
    - metadata:
        name: workdir
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: proxmox-data-xfs
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: bm-utils
spec:
  selector:
    app: bm-utils
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
---
kind: ListenerSet
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: bm-utils
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production-gatewayapi
spec:
  parentRef:
    name: starscream
    namespace: envoy-gateway-system
  listeners:
    - name: https
      hostname: utils.bm.tuana9a.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: utils-bm-tuana9a-com-tls
    - name: http # requires for cert http challenge
      hostname: utils.bm.tuana9a.com
      port: 80
      protocol: HTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bm-utils
spec:
  parentRefs:
    - kind: ListenerSet
      name: bm-utils
  hostnames:
    - utils.bm.tuana9a.com
  rules:
    - backendRefs:
        - kind: Service
          name: bm-utils
          port: 5000
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
